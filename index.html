<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mcontainer">
        <div class="ctnsi">
            <div class="header">
                <div class="title">
                    <h1>Etch a skecth</h1>
                </div>
                <div class="slidecontainer">
                    <input type="range" min="4" max="64" value="4" class="slider" id="myRange">
                </div>
                <div class="text-slider ">
                    <p class="countsize"></p>
                </div>
            </div>     
        </div>
        <div class="canvasCon">
            <div class="buttonContainer">
            <button class="btnCpicker active">
                Pick Color
                <span class="picked-color">
                    <input class="colorPicker" type="color" value="#000000" />
                </span>
            </button>
                <button class="random">Raibow</button>
                <button class="shading">Shading</button>
                <button class="btnBorder">Hide Border</button>
                <button class="white">Clear</button>
            </div>
            <div class="canvas-frame">
                <div class="container">
                </div>
            </div>
        </div>


    </div>

    
    
    <script src="script.js"></script>
</body>
</html>
